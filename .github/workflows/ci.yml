name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # CI needs a valid production origin for the static metadata build. This
      # reserved domain is never used as a deployment URL.
      NEXT_PUBLIC_SITE_URL: https://example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Print formatted guide diff (temporary)
        run: |
          npx prettier --write src/data/guides.ts
          git diff -- src/data/guides.ts

      - name: Check formatting
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        env:
          NEXT_PUBLIC_SITE_URL: https://llmgauge.dev
        run: npm run build
