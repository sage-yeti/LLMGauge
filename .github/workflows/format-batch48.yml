name: Format Batch 48 sources

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/app/gpu-compatibility.test.tsx src/app/gpu-compatibility.tsx src/application/gpu-compatibility-share.test.ts src/application/gpu-compatibility-share.ts
      - name: Emit formatted sources for review
        run: |
          node -e "const fs=require('fs'); for (const file of ['src/app/gpu-compatibility.test.tsx','src/app/gpu-compatibility.tsx','src/application/gpu-compatibility-share.test.ts','src/application/gpu-compatibility-share.ts']) console.log('FORMATTED_FILE '+file+' '+fs.readFileSync(file,'base64'))"
